<script>
    const form = document.getElementById('jobForm');
    const tableBody = document.querySelector('#jobTable tbody');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const date = document.getElementById('date').value;
        const desc = document.getElementById('description').value;
        const projectAmount = document.getElementById('projectAmount').value;
        const jobAmount = parseFloat(document.getElementById('jobAmount').value).toFixed(2);
        const charged = parseFloat(document.getElementById('chargedAmount').value).toFixed(2);
        const partnerShare = (charged * 0.3).toFixed(2);
        const type = document.getElementById('jobType').value;
        const status = document.getElementById('status').value;

        const row = `<tr>
                        <td>${date}</td>
                        <td>${desc}</td>
                        <td>${projectAmount}</td>
                        <td>${jobAmount}</td>
                        <td>${charged}</td>
                        <td>${partnerShare}</td>
                        <td>${type}</td>
                        <td>${status}</td>
                    </tr>`;
        tableBody.innerHTML += row;
        form.reset();
    });

    // Preload existing job entries
    const initialJobs = [
        {
            date: '2025-05-18',
            desc: 'Back and Front',
            projectAmount: 'R11,500',
            jobAmount: 'R2,000.00',
            charged: 'R2,000.00',
            partnerShare: (2000 * 0.3).toFixed(2),
            type: 'Bank Login',
            status: 'Successful'
        },
        {
            date: '2025-05-19',
            desc: 'Nedbank Debit Order (Pending)',
            projectAmount: 'R300,000',
            jobAmount: 'R99,000.00',
            charged: 'R99,000.00',
            partnerShare: (99000 * 0.3).toFixed(2),
            type: 'Interception',
            status: 'Pending'
        },
        {
            date: '2025-05-19',
            desc: 'Crypto Currency Flash',
            projectAmount: '$29,999',
            jobAmount: '$2,000.00',
            charged: '2000.00',
            partnerShare: (2000 * 0.3).toFixed(2),
            type: 'SWIFT Flash',
            status: 'Successful (Payout Pending)'
        }
    ];

    initialJobs.forEach(job => {
        const row = `<tr>
                        <td>${job.date}</td>
                        <td>${job.desc}</td>
                        <td>${job.projectAmount}</td>
                        <td>${job.jobAmount}</td>
                        <td>${job.charged}</td>
                        <td>${job.partnerShare}</td>
                        <td>${job.type}</td>
                        <td>${job.status}</td>
                    </tr>`;
        tableBody.innerHTML += row;
    });
</script>
